name: Snyk Container Security Scan

on:
  workflow_dispatch:
    inputs:
      severity_threshold:
        description: 'Nivel de severidad (low/medium/high)'
        required: true
        default: 'low'
        type: choice
        options:
          - low
          - medium
          - high

jobs:
  container-security:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "Error: Dockerfile not found"
            exit 1
          fi

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set Dockerfile permissions
        run: chmod 644 Dockerfile
      
      - name: Build Docker Image
        run: docker build -t test-image .
      
      - name: Run Snyk Container Test
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image
          dockerfile: ./Dockerfile
          args: |
            --severity-threshold=${{ inputs.severity_threshold }}
            --no-cache
          
      - name: Generate Security Report
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image
          dockerfile: ./Dockerfile
          args: --json > snyk-container-report.json
          
      - name: Upload Security Report
        uses: actions/upload-artifact@v3
        with:
          name: snyk-security-report
          path: snyk-container-report.json
