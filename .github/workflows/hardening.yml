name: Snyk Security Scan

on:
  push:
    branches: 
      - integration
      - laboratory
      - main
  pull_request:
    branches: 
      - integration
      - laboratory
      - main
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [integration, laboratory, main]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: |
            ${{ matrix.branch == 'main' && '--severity-threshold=high' ||
               matrix.branch == 'laboratory' && '--severity-threshold=medium' ||
               '--severity-threshold=low' }}
      
      - name: Run Snyk Container Test
        if: hashFiles('Dockerfile') != ''
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image-${{ matrix.branch }}
          args: --file=Dockerfile
      
      - name: Monitor Application Dependencies
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --org=your-org-name --project-name=${{ github.repository }}-${{ matrix.branch }}

      - name: Snyk Auto-Remediation
        if: matrix.branch == 'integration' && github.event_name == 'push'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: fix
          args: --org=your-org-name
      
      - name: Generate Security Report
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --json > snyk-report-${{ matrix.branch }}.json
          
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report-${{ matrix.branch }}
          path: snyk-report-${{ matrix.branch }}.json
