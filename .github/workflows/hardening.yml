name: Snyk Container Security Scan

on:
  push:
    branches: 
      - integration
      - laboratory
      - main
    paths:
      - 'Dockerfile'
  pull_request:
    branches: 
      - integration
      - laboratory
      - main
    paths:
      - 'Dockerfile'
  # Agregar validación para PRs desde ramas feature
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  container-security:
    runs-on: ubuntu-latest
    # Modificar la estrategia para incluir la rama del PR
    strategy:
      matrix:
        branch: ${{ github.event_name == 'pull_request' && [github.head_ref] || ['integration', 'laboratory', 'main'] }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      
      - name: Build Docker Image
        run: docker build -t test-image-${{ matrix.branch }} .
      
      - name: Run Snyk Container Test
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image-${{ matrix.branch }}
          args: |
            --file=Dockerfile
            --severity-threshold=low
            --no-cache
      
      # Agregar paso de validación para PRs
      - name: Check PR Security Status
        if: github.event_name == 'pull_request'
        run: |
          if [ ${{ job.status }} == 'failure' ]; then
            echo "❌ La validación de seguridad falló. Por favor, revisa las vulnerabilidades encontradas."
            exit 1
          fi
