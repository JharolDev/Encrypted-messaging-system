name: Snyk Container Security Scan

on:
  push:
    branches: 
      - integration
      - laboratory
      - main
    paths:
      - 'Dockerfile'
  pull_request:
    branches: 
      - integration
      - laboratory
      - main
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  container-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [integration, laboratory, main]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}
      
      - name: Build Docker Image
        run: docker build -t test-image-${{ matrix.branch }} .
      
      - name: Run Snyk Container Test
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image-${{ matrix.branch }}
          args: |
            --file=Dockerfile
            --severity-threshold=${{ matrix.branch == 'main' && 'high' || matrix.branch == 'laboratory' && 'medium' || 'low' }}
            --no-cache
      
      - name: Monitor Container Image
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image-${{ matrix.branch }}
          args: --file=Dockerfile --org=your-org-name --project-name=${{ github.repository }}-docker-${{ matrix.branch }}
          command: monitor
          
      - name: Generate Container Security Report
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-image-${{ matrix.branch }}
          args: --file=Dockerfile --json > snyk-container-report-${{ matrix.branch }}.json
          
      - name: Upload Container Security Report
        uses: actions/upload-artifact@v3
        with:
          name: snyk-container-report-${{ matrix.branch }}
          path: snyk-container-report-${{ matrix.branch }}.json
